# Baut die macOS-Binaries auf GitHub-gehosteten Mac-Runnern, weil PyInstaller
# nicht cross-kompiliert und lokal kein Mac vorhanden ist. Zwei Architekturen,
# Apple Silicon (arm64) und Intel (x86_64), ein Binary laeuft nur auf seiner.
name: build-macos
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon (M1 und neuer)
            arch: arm64
          - runner: macos-15-intel    # Intel-Macs
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: bash packaging/build.sh
      - name: Artefakte nach Architektur benennen
        run: |
          mv dist/berichtsheft-macos dist/berichtsheft-macos-${{ matrix.arch }}
          mv dist/berichtsheft-macos-demo dist/berichtsheft-macos-demo-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: berichtsheft-macos-${{ matrix.arch }}
          path: dist/berichtsheft-macos*
