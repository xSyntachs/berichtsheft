# Baut alle Release-Artefakte auf GitHub-Runnern, je Plattform nativ, weil
# PyInstaller nicht cross-kompiliert. Windows über build.ps1, Linux und macOS
# über build.sh (das erkennt die Plattform per uname). macOS zweimal, weil
# Apple Silicon und Intel getrennte Binaries brauchen.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pwsh -File packaging/build.ps1   # Docker fehlt auf dem Runner, Linux-Teil skippt sauber
      - uses: actions/upload-artifact@v4
        with:
          name: berichtsheft-windows
          path: dist/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: bash packaging/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: berichtsheft-linux
          path: dist/berichtsheft-linux*

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon (M1 und neuer)
            arch: arm64
          - runner: macos-15-intel    # Intel-Macs
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: bash packaging/build.sh
      - name: Artefakte nach Architektur benennen
        run: |
          mv dist/berichtsheft-macos dist/berichtsheft-macos-${{ matrix.arch }}
          mv dist/berichtsheft-macos-demo dist/berichtsheft-macos-demo-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: berichtsheft-macos-${{ matrix.arch }}
          path: dist/berichtsheft-macos*

  # Haengt alle Binaries als Release "latest" ans Repo. Der Tag wird je Lauf neu
  # gesetzt, damit er immer auf den gebauten Commit zeigt.
  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest artifacts/* setup/download.bat setup/download.sh setup/Anleitung.pdf \
            --target "$GITHUB_SHA" \
            --title "Berichtsheft-Suite (aktueller Stand)" \
            --notes "Automatisch gebaut von Commit ${GITHUB_SHA::7}. Endnutzer sehen diese Seite nicht, verteilt wird der SharePoint-Ordner mit download.bat, download.sh und Anleitung.pdf (hier angehängt, zum Aktualisieren des SharePoint-Ordners). Die Skripte ziehen die Binaries aus diesem Release, macOS arm64/intel automatisch, ohne SmartScreen- oder Gatekeeper-Dialog, und starten das Tool direkt."
